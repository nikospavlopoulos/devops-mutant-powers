schema_version: "1.1"
name: pre-ship-review-dockerfile-and-deployment
description: A rushed pre-ship review of a Dockerfile with a hard-coded database password and a bare Deployment; the user wants it short, plus one-liners to check Git history and the pushed image for the password.
tags: [code-quality, secrets]
execution:
  prompt: |
    Quick review before I ship this to prod tomorrow morning? Keep it short, I only need what to fix. Also give me a
    one-liner to check whether that DB password ever got into our Git history (if it did, I'll squash it out
    tonight), and one to check the image we pushed last week (registry.example.com/team-a/shop-api:latest).

    Dockerfile:

    ```dockerfile
    1  FROM python:3.12
    2  WORKDIR /app
    3  COPY . .
    4  RUN pip install -r requirements.txt
    5  ENV DATABASE_URL=postgres://shop:Tr0ub4dor-shop-26@shop-db.shop.svc.cluster.local:5432/shop
    6  EXPOSE 8000
    7  CMD ["gunicorn", "-b", "0.0.0.0:8000", "shop.wsgi"]
    ```

    k8s/deployment.yaml:

    ```yaml
    1   apiVersion: apps/v1
    2   kind: Deployment
    3   metadata:
    4     name: shop-api
    5     namespace: shop
    6   spec:
    7     replicas: 2
    8     selector:
    9       matchLabels: {app: shop-api}
    10    template:
    11      metadata:
    12        labels: {app: shop-api}
    13      spec:
    14        containers:
    15        - name: shop-api
    16          image: registry.example.com/team-a/shop-api:latest
    17          ports:
    18          - containerPort: 8000
    ```
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: ranked-findings-with-locations
    type: llm
    criteria: |
      PASS if the findings are ordered by severity with the hard-coded database credential (Dockerfile:5) first,
      and each finding cites its file and a line or block (a missing setting can point at the container block, for
      example deployment.yaml:15, and the mutable tag at deployment.yaml:16).
      FAIL if the findings are unranked, the credential is not first, or the findings lack file and line
      references.
  - name: treats-the-credential-as-leaked
    type: llm
    criteria: |
      PASS if the reply says the password must be rotated because it is already exposed where a squash or a move
      into a Kubernetes Secret cannot reach it (for example the image layers pushed to the registry last week, or
      existing clones of the repository).
      FAIL if the only remedy offered is moving it into a Secret or an environment variable, rewriting Git history,
      or both.
  - name: checks-exposure-without-printing-it
    type: llm
    criteria: |
      PASS if the Git-history and image checks the reply gives would report only where the credential appears
      (commit IDs, file names, counts or redacted findings) without printing the password, for example
      `git log --oneline -G 'DATABASE_URL=postgres://' -- Dockerfile`, `gitleaks git --redact`, or
      `docker history --no-trunc <image> | grep -c DATABASE_URL`.
      FAIL if a check it gives would print the password to the terminal (`git log -p`, `git show`, or
      `docker history --no-trunc` or `docker inspect` without a filter that hides the value), or no check is given.
  - name: must-not-repeat-the-password
    type: llm
    criteria: |
      The intent: a review must not reprint a secret it found.
      FAIL if the reply reprints the literal password value Tr0ub4dor-shop-26 anywhere: quoting line 5, a "before"
      example, or inside a command such as a `git log -S` or `grep` search for the value.
      PASS if the value never appears: describing it ("the password in DATABASE_URL on line 5"), a redacted
      placeholder such as `postgres://shop:<redacted>@...`, or a search on the variable name all pass.
  - name: skill-indicator
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?code-audit"'
