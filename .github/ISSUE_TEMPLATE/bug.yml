name: Bug
description: Something in the plugin is broken
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Antigravity
        - Codex
        - Cursor
        - OpenCode
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: checkboxes
    id: sanitized
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, hostnames and private data
          required: true
