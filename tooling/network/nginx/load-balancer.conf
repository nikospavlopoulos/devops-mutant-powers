# Load balancing over several backends. Include in http{}. Placeholders: SERVER_NAME, UPSTREAM_HOST, UPSTREAM_PORT;
# extra backends use RFC 5737 example addresses: replace them.
# Open-source nginx has PASSIVE health checks only: a server is skipped for fail_timeout after max_fails failed
# requests within fail_timeout. Active probes (health_check) are NGINX Plus only; a dead backend still costs
# real client requests until it is marked down.
upstream app_backend {
    zone app_backend 64k;                                   # shared across workers; without it each worker counts failures alone
    least_conn;                                             # CHANGE: or round-robin (default), ip_hash, hash $key
    server UPSTREAM_HOST:UPSTREAM_PORT max_fails=3 fail_timeout=30s;  # CHANGE
    server 192.0.2.12:UPSTREAM_PORT max_fails=3 fail_timeout=30s;     # CHANGE: second backend
    server 192.0.2.13:UPSTREAM_PORT backup;                           # CHANGE: used only when all others are down
    keepalive 32;                                           # idle upstream connections cached per worker
    # nginx >= 1.27.3: add "resolve" to a server with a DNS name (plus a resolver directive) to follow DNS changes.
}

server {
    listen 80;
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;                             # keepalive needs 1.1; default only since 1.29.7
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # What counts as a failure (for max_fails) and when to try the next server.
        # POST/PATCH/LOCK are never retried once sent (add non_idempotent only if the app is safe to replay).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;                        # CHANGE: bound retries so one request cannot hit every backend
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 2s;                           # fail over quickly from an unreachable backend
        proxy_read_timeout 60s;                             # CHANGE: slowest expected response
    }
}
