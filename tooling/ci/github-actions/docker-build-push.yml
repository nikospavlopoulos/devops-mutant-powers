# Build on every PR (no push); build + push to GHCR on the default branch and version tags, with SBOM and
# provenance attestations. Version tags then call deploy-k8s.yml with the pushed digest.
name: docker-build-push

on:
  pull_request:
  push:
    branches: [main]                                  # CHANGE: default branch
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a push mid-publish

env:
  IMAGE: ghcr.io/example-org/app-a                    # CHANGE: registry/repository, lowercase

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                                 # push with GITHUB_TOKEN; fork PRs still get a read-only token
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile                          # CHANGE: e.g. a copy of tooling/containers/dockerfiles/go.Dockerfile
          platforms: linux/amd64                      # CHANGE: add linux/arm64 together with docker/setup-qemu-action
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: read
      id-token: write                                 # the called workflow requests an OIDC token
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      image: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}  # deploy by digest, not by tag
