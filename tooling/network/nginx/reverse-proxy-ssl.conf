# TLS termination + HTTP-to-HTTPS redirect in front of one upstream. Include in http{}.
# Placeholders: SERVER_NAME, UPSTREAM_HOST, UPSTREAM_PORT. Certificate renewal (certbot/acme.sh) must reload nginx.
server {
    listen 80;
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;                                 # CHANGE: ACME HTTP-01 webroot; delete the block for DNS-01
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;                                               # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;

    ssl_certificate     /etc/nginx/tls/SERVER_NAME/fullchain.pem;  # CHANGE: leaf + intermediates, leaf first
    ssl_certificate_key /etc/nginx/tls/SERVER_NAME/privkey.pem;    # CHANGE: mode 600, readable by root only

    # TLS 1.2 + 1.3 (Mozilla "intermediate"). TLSv1.3 alone is the "modern" profile when every client supports it.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Applies to TLS 1.2 only; TLS 1.3 suites are all AEAD and not set here.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;                                # tickets without key rotation weaken forward secrecy

    # HSTS is opt-in: browsers then refuse plain HTTP for max-age seconds, so enable it only once HTTPS works
    # for this host (and every subdomain, if you add includeSubDomains).
    # add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10m;                               # CHANGE: largest request body

    location / {
        proxy_pass http://UPSTREAM_HOST:UPSTREAM_PORT;      # CHANGE: plain HTTP to the upstream on a trusted network
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;           # the app builds https:// redirects and secure cookies from this
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;                             # CHANGE: slowest expected response
    }
}
