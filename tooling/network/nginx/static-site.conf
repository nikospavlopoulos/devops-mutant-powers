# Static files / single-page app. Include in http{}. Placeholder: SERVER_NAME.
# Port 8080 matches nginx.Dockerfile (nginx-unprivileged cannot bind below 1024); use 80 for a host install.
server {
    listen 8080;                                            # CHANGE: 80 on a host
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;
    root /usr/share/nginx/html;                             # CHANGE: document root
    index index.html;

    # add_header in a location drops every add_header inherited from here, so caching below uses
    # "expires" (a different directive) and these headers reach every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;                   # SPA fallback; use "=404" for a plain static site
    }

    location /assets/ {                                     # CHANGE: directory of fingerprinted build output
        expires 1y;                                         # safe only because file names change with content
        try_files $uri =404;                                # a missing JS file must 404, not return index.html
    }

    location = /index.html {
        expires -1;                                         # "Cache-Control: no-cache": clients revalidate, new deploys show up
    }
}
