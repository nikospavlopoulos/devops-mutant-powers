schema_version: "1.1"
name: trivial-kubectl-flag-question
description: Guard case. A trivial question should get a correct, direct answer, with no skill and no process ceremony.
tags: [guard, proportion]
execution:
  prompt: |
    What does `kubectl get pods -A` do?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-skill-fires
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: short-direct-answer
    type: llm
    criteria: |
      Judge content and process only. Formatting and length do not decide the verdict: bullets, headings, a short
      example output, a brief explanation of the columns or terms, and related variations of the command are all
      fine.
      PASS if the reply correctly says the command lists the pods in all namespaces of the current cluster (-A is
      short for --all-namespaces) and adds no process ceremony.
      FAIL if the content is wrong (for example that -A means all clusters or all contexts), or if the reply adds
      process ceremony: clarifying questions, hypotheses, approval steps, a plan, a list of follow-up actions for
      the user to take, or an offer to draw a diagram.
