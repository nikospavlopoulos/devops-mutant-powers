# WebSocket-aware reverse proxy. Include in http{}. Placeholders: SERVER_NAME, UPSTREAM_HOST, UPSTREAM_PORT.
# Upgrade and Connection are hop-by-hop headers: nginx does not forward them unless set explicitly.

# Define this map once per http{} block; a second definition of $connection_upgrade fails `nginx -t`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;

    location /ws/ {                                         # CHANGE: WebSocket path
        proxy_pass http://UPSTREAM_HOST:UPSTREAM_PORT;      # CHANGE
        proxy_http_version 1.1;                             # Upgrade needs HTTP/1.1; default only since 1.29.7
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An idle socket is closed after proxy_read_timeout (default 60s) unless the app sends pings.
        proxy_read_timeout 1h;                              # CHANGE: > the app's ping interval
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://UPSTREAM_HOST:UPSTREAM_PORT;      # CHANGE
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
