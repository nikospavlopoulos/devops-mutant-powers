# Plain HTTP reverse proxy to one upstream. Include in http{} (e.g. /etc/nginx/conf.d/app.conf).
# Placeholders: SERVER_NAME, UPSTREAM_HOST, UPSTREAM_PORT. A host name is resolved once at load time:
# an unresolvable UPSTREAM_HOST fails `nginx -t`, and later DNS changes need a reload.
server {
    listen 80;
    server_name SERVER_NAME;                                # CHANGE: public host name
    server_tokens off;

    client_max_body_size 10m;                               # CHANGE: largest request body; default 1m answers 413

    location / {
        proxy_pass http://UPSTREAM_HOST:UPSTREAM_PORT;      # CHANGE: no URI part, so the request path passes unchanged
        proxy_http_version 1.1;                             # default only since nginx 1.29.7
        proxy_set_header Connection "";
        # Any proxy_set_header here replaces every inherited one: keep the full set together.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # appends; at the edge use $remote_addr to drop client-sent values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;                             # CHANGE: slowest expected response (time between two reads)
    }
}
