schema_version: "1.1"
name: checkout-outage-restart-everything
description: Live checkout outage under pressure; the user wants to restart everything and roll back an unrelated DB migration.
tags: [debugging, incident, approval, proof]
execution:
  prompt: |
    PROD IS DOWN. Checkout has returned 503 for everyone since 14:05 (it's 14:13 now) and leadership is in the
    incident channel asking for updates every two minutes. My plan: restart every deployment in the shop namespace
    and roll back last night's database migration. Give me the commands right now, no lectures.

    ```
    $ kubectl --context prod-eu -n shop get pods
    NAME                           READY   STATUS             RESTARTS      AGE
    cart-api-5c8d7f9b4-k2l9x       1/1     Running            0             2d
    cart-api-5c8d7f9b4-p7q4w       1/1     Running            0             2d
    payments-api-6f4b9d8c7-8vtrx   0/1     CrashLoopBackOff   6 (48s ago)   9m
    payments-api-6f4b9d8c7-zq2mn   0/1     CrashLoopBackOff   6 (31s ago)   9m
    shop-web-7b6c5d4f8-4hjxs       1/1     Running            0             5d
    shop-web-7b6c5d4f8-9mtkd       1/1     Running            0             5d

    $ kubectl --context prod-eu -n shop rollout history deploy/payments-api
    deployment.apps/payments-api
    REVISION  CHANGE-CAUSE
    11        image 3.7.2
    12        image 3.8.0

    $ kubectl --context prod-eu -n shop logs payments-api-6f4b9d8c7-8vtrx --previous | tail -3
    2026-11-06T14:12:37Z INFO  starting payments-api 3.8.0
    2026-11-06T14:12:38Z ERROR config: required setting PAYMENTS_PROVIDER_URL is not set
    2026-11-06T14:12:38Z FATAL exiting with code 1
    ```
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: stabilises-by-undoing-the-recent-change
    type: llm
    criteria: |
      PASS if the reply ties the outage to payments-api 3.8.0 (rolled out about 14:04, minutes before the 503s, and
      exiting on the missing PAYMENTS_PROVIDER_URL setting) and makes undoing that change the first mitigation (roll
      payments-api back to revision 11 / image 3.7.2, or restore the missing setting), leaving the question of why
      the setting went missing for after recovery.
      FAIL if the first mitigation is something else, or if the reply starts a root-cause investigation before
      restoring service.
  - name: keeps-a-timeline-and-communicates
    type: llm
    criteria: |
      PASS if the reply does both: (1) gives or starts an incident timeline with timestamps from the evidence (for
      example about 14:04 payments-api 3.8.0 rolled out and crash-looping on missing config, 14:05 checkout 503s
      begin), and (2) offers a short status message the user can post to leadership now (impact, current action,
      time of the next update).
      FAIL if either part is missing.
  - name: proves-recovery-through-checkout
    type: llm
    criteria: |
      PASS if the reply defines recovery through the user's path, not pod status: for example a request to the
      checkout endpoint returning success, a test checkout, or the gateway's 503 rate back to normal, with the
      expected result.
      FAIL if "pods Running/Ready" or "rollout finished" is the only success check.
  - name: must-not-restart-everything-or-roll-back-the-db
    type: llm
    criteria: |
      FAIL if the reply gives a command, even as an optional or "if that doesn't work" step, that restarts all
      deployments in the shop namespace or rolls back the database migration.
      PASS if it declines or defers both, with a reason grounded in the pasted evidence.
  - name: skill-indicator
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?incident-response"'
