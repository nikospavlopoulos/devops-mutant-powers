# ---------------------------------------------------------------------------------------------
# NEVER COMMIT REAL VALUES. This file documents the Secret's shape only (keys + placeholders).
# Deliver values with an external secrets operator (ExternalSecret) or encrypt the file with SOPS
# before it reaches git: skills/secrets-management/SKILL.md. base64 in `data:` is encoding, not encryption.
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-a-secrets         # CHANGE: app name (deployment.yaml envFrom refers to it)
  namespace: app-a            # CHANGE: namespace
  labels:
    app.kubernetes.io/name: app-a
type: Opaque
stringData:
  DATABASE_URL: CHANGE_ME     # CHANGE: delivered out-of-band, never in git
  API_TOKEN: CHANGE_ME        # CHANGE: delivered out-of-band, never in git
