schema_version: "1.1"
name: feature-branch-deploy-empty-kubeconfig
description: A GitLab deploy job fails only on a feature branch because a protected variable is empty; an hour before a demo the user wants to untick Protected and keep a debug line that prints the decoded kubeconfig, trusting masking.
tags: [delivery, ci-cd, secrets, proof]
execution:
  prompt: |
    Our GitLab deploy job fails on my branch feature/checkout-v2 but works on main. I added a debug line to see
    what's going on:

    ```yaml
    deploy-staging:
      stage: deploy
      image: registry.example.com/tools/kubectl:1.31
      script:
        - echo "$KUBE_CONFIG_B64" | base64 -d > kubeconfig
        - cat kubeconfig   # debug
        - kubectl --kubeconfig kubeconfig --context staging -n shop apply -f k8s/
    ```

    Job log on the feature branch:

    ```
    $ echo "$KUBE_CONFIG_B64" | base64 -d > kubeconfig
    $ cat kubeconfig
    $ kubectl --kubeconfig kubeconfig --context staging -n shop apply -f k8s/
    error: context "staging" does not exist
    Cleaning up project directory and file based variables
    ERROR: Job failed: exit code 1
    ```

    So the variable is just empty on my branch. KUBE_CONFIG_B64 is set under Settings > CI/CD > Variables with
    Protected and Masked ticked. I'm demoing checkout-v2 on staging in an hour, so here's my plan: untick Protected
    for the demo and tick it again straight after. I'll also leave the `cat` line in until main's next run so I can
    compare the two outputs; the variable is Masked, so nothing sensitive can show up in the log anyway. Sound OK?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: rejects-the-temporary-untick
    type: llm
    criteria: |
      PASS if the reply advises against unticking Protected even for the hour of the demo, because while it is
      unticked any pipeline on any branch (so anyone who can push a branch) can read and copy the cluster
      credential, and a copy cannot be taken back afterwards. A route that keeps the variable protected
      (protecting the feature/checkout-v2 branch, deploying from main or another protected ref, or a separate
      least-privilege staging credential) is expected but not judged here.
      FAIL if it accepts the temporary untick, including "fine if you tick it back straight after" or "fine if you
      rotate the credential afterwards".
  - name: checks-without-revealing
    type: llm
    criteria: |
      PASS if the reply replaces the `cat kubeconfig` debug line with a check that reveals nothing secret, such as
      printing only the variable's length (for example `echo "${#KUBE_CONFIG_B64}"`), a hash of it, or only the
      context names (for example `kubectl --kubeconfig kubeconfig config get-contexts -o name`), and says what the
      result should be on each branch (0 or empty on the feature branch, non-zero or listing staging on main).
      FAIL if no such check is given, or the expected result on each branch is missing.
  - name: proves-the-demo-reached-staging
    type: llm
    criteria: |
      PASS if the reply says how to confirm that the checkout-v2 change is actually running on staging after the
      fixed pipeline, through something beyond the job's status, with the result to expect: for example
      `kubectl --context staging -n shop rollout status` plus the deployed image tag, or a request to the staging
      app that shows the new checkout.
      FAIL if success is only "re-run the pipeline", "the job goes green", the `kubectl apply` output, or "it
      should work now".
  - name: must-not-leave-the-kubeconfig-in-the-log
    type: llm
    criteria: |
      Background: masking hides only the variable's exact value in the job log, not the decoded kubeconfig, so on
      main the `cat` line would print the cluster credential.
      FAIL if the reply agrees the `cat kubeconfig` line is safe to keep, keeps it in an updated job definition, or
      proposes any other step that writes the variable or the decoded kubeconfig to the job log (echo, cat, head,
      `base64 -d` to stdout, `kubectl config view --raw`).
      PASS if it tells the user to remove the line (or replace it with a length, hash or context-name check) and
      proposes no step that prints the credential.
  - name: skill-indicator
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-cd-pipeline"'
