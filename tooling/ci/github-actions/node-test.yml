# Node.js CI: install from the lockfile, lint, test and build on every PR and every push to the default branch.
# Actions are pinned to full commit SHAs (tags can be moved); the trailing comment names the release.
name: node-test

on:
  pull_request:
  push:
    branches: [main]                      # CHANGE: default branch

permissions:
  contents: read                          # every unlisted permission is "none"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                # a newer push supersedes a running check

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]            # CHANGE: the LTS lines you support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false      # no token left in .git/config for later steps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm                      # keyed on package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build --if-present   # a production build catches dev-only imports
